# =============================================
# Configuracion de pytest para las pruebas del equipo QA
# ---------------------------------------------
# Se corre desde la raiz de este repo con el Python del submodulo:
#   synapseed\src\backend\.venv\Scripts\python -m pytest
[pytest]
testpaths = tests
# importlib permite archivos con el mismo nombre en carpetas de areas distintas
addopts = --import-mode=importlib
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Las advertencias de deprecacion de dependencias no fijadas no detienen la suite (hallazgo 1)
filterwarnings =
    ignore::DeprecationWarning
# tests/conftest.py asigna estas marcas segun la subcarpeta de cada prueba
markers =
    unit: prueba unitaria con dobles de prueba
    integration: colaboracion entre componentes con efecto de lado verificado
    security: verificacion de seguridad contra el ambiente QA local
    performance: prueba de rendimiento escrita en Python
